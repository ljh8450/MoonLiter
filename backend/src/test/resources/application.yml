spring:
  datasource:
    url: jdbc:h2:mem:moonliter-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test.supabase.co/auth/v1
          jwk-set-uri: https://test.supabase.co/auth/v1/.well-known/jwks.json

moonliter:
  phone:
    hash-secret: test-phone-hash-secret
  sms:
    solapi:
      api-key: test-api-key
      api-secret: test-api-secret
      sender: '01012345678'
